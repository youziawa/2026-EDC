metadata:
  name: land_air_cooperative_mission_state_machine
  title: 陆空协同无人机系统统一状态机
  version: "1.0"
  language: zh-CN
  human_document: 陆空协同统一状态机.md
  protocol: LXS1
  intended_consumers:
    - firmware_engineer
    - pyqt_ground_station_engineer
    - code_generation_ai

system:
  description: 飞机、小车和电脑地面站组成的陆空协同系统
  global_state_owner: aircraft_controller
  mission_start_owner: car_controller
  normal_operation_requires_ground_station: false
  track_direction: clockwise
  action_zone:
    start: C
    end: D

devices:
  aircraft_controller:
    address: 0x02
    responsibilities:
      - own_global_state
      - maintain_direct_car_link
      - maintain_direct_ground_station_link
      - control_flight_controller
      - execute_drop_or_dynamic_landing
      - return_and_land_at_H
  aircraft_k230:
    address: 0x03
    responsibilities:
      - detect_car_and_platform
      - publish_relative_pose
      - publish_visual_confidence
  car_controller:
    address: 0x04
    responsibilities:
      - start_mission_from_physical_button
      - follow_black_line
      - maintain_odometry
      - detect_track_events
      - change_speed_in_action_zone
      - stop_after_one_lap
  car_k230:
    address: 0x05
    responsibilities:
      - detect_black_line
      - publish_line_error
      - detect_finish_track_dot
  ground_station:
    address: 0x06
    implementation: PyQt
    responsibilities:
      - visualize_map_and_trajectories
      - display_states_and_faults
      - record_csv_or_json_logs
      - send_query
      - send_emergency_abort
    forbidden_responsibilities:
      - own_global_state
      - drive_car_during_official_mission
      - manually_fly_aircraft_during_official_mission

task_modes:
  DROP:
    code: 1
    description: 抛投任务
  DYNAMIC_LANDING:
    code: 2
    description: 动态起降任务

global_states:
  IDLE:
    code: 0
    description: 待机和自检
  TAKEOFF:
    code: 1
    description: 从H点起飞至巡航高度
  HOVER_3S:
    code: 2
    description: 抛投模式稳定悬停3秒
  SEARCH:
    code: 3
    description: 搜索小车和平台
  FOLLOW:
    code: 4
    description: 跟随小车并等待C点事件
  DROP:
    code: 5
    description: 在C到D区间执行抛投
  LAND_CAR:
    code: 6
    description: 在C到D区间降落到移动平台
  WAIT_5S:
    code: 7
    description: 在移动平台稳定停留至少5秒
  RETAKEOFF:
    code: 8
    description: 从移动平台再次起飞
  RETURN:
    code: 9
    description: 返回H点
  LAND_H:
    code: 10
    description: 降落到H点
  DONE:
    code: 11
    description: 飞机任务完成
  ABORT:
    code: 12
    description: 人工紧急中止
  FAULT:
    code: 13
    description: 不可恢复故障

car_states:
  READY:
    code: 0
    description: 自检完成并等待按键
  STARTING:
    code: 1
    description: 去抖、清零和锁存任务参数
  NORMAL_TRACK:
    code: 2
    description: 正常速度循线
  ACTION_SLOW:
    code: 3
    description: C到D动作区低速循线
  LOST_HOLD:
    code: 4
    description: 短时丢线并保持最后转向
  REACQUIRE:
    code: 5
    description: 低速寻找黑线
  FINISH_CONFIRM:
    code: 6
    description: 完成一圈后的A点终点确认
  DONE:
    code: 7
    description: 一圈完成并停车
  ABORT:
    code: 8
    description: 人工中止并立即停车
  FAULT:
    code: 9
    description: 不可恢复故障并停车

track_events:
  B_CROSS:
    code: 1
    trigger: path_mm >= point_b_path_mm
  C_ENTER:
    code: 2
    trigger: point_c_path_mm <= path_mm < point_d_path_mm
    repeat_while_active: true
  D_EXIT:
    code: 3
    trigger: path_mm >= point_d_path_mm
  A_FINISH:
    code: 4
    trigger: path_mm >= lap_path_mm

parameters:
  normal_speed_mm_s: 150
  action_speed_mm_s: 80
  reacquire_speed_mm_s: 40
  starting_search_speed_mm_s: 40
  starting_search_timeout_ms: 3000
  start_safety_delay_ms: 10000
  wheel_diameter_mm: 47
  wheel_track_mm: 432
  left_counts_per_rev: 41589
  right_counts_per_rev: 41348
  odometry_calibration: 1.05187
  point_b_path_mm: 1500
  point_c_path_mm: 3856
  point_d_path_mm: 5356
  lap_path_mm: 7712
  vision_binary_preprocess_enabled: true
  vision_binary_dilate_iterations: 1
  vision_binary_erode_iterations: 1
  vision_marker_min_strips: 1
  vision_marker_min_width_px: 70
  vision_marker_hold_min_strips: 1
  vision_marker_on_confirm_frames: 2
  vision_marker_off_confirm_frames: 8
  line_lateral_kp_pps_per_mm: 130
  line_heading_kp_pps_per_deg: 220
  line_lateral_deadband_mm: 3
  line_heading_deadband_deg: 1
  line_curvature_deadband: 120
  line_curvature_weight_percent: 35
  line_max_correction_pps: 15000
  line_correction_filter_divisor: 6
  line_correction_max_step_pps: 2200
  target_height_cm: 150
  target_height_tolerance_cm: 10
  hover_required_ms: 3000
  platform_wait_required_ms: 5000
  task_deadline_ms: 90000
  point_b_deadline_ms: 15000
  speed_ramp_required: true

state_machines:
  drop_mission:
    initial_state: IDLE
    transitions:
      - from: IDLE
        event: TASK_START
        guards:
          - task_mode == DROP
          - run_id_is_new
          - flight_controller_ready
        to: TAKEOFF
        entry_actions:
          - latch_run_id
          - reset_mission_timer
          - command_takeoff_once
        periodic_actions:
          - publish_TASK_STATE
        exit_actions:
          - mark_takeoff_command_complete
        timeout: 10000
        failure_transition: FAULT
      - from: TAKEOFF
        event: TARGET_HEIGHT_STABLE
        guards:
          - abs(height_cm - target_height_cm) <= target_height_tolerance_cm
          - vertical_speed_is_stable
        to: HOVER_3S
        entry_actions:
          - start_hover_timer
        periodic_actions:
          - command_hold_position
          - publish_TASK_STATE
        exit_actions:
          - clear_hover_timer
        timeout: 15000
        failure_transition: FAULT
      - from: HOVER_3S
        event: HOVER_TIMER_COMPLETE
        guards:
          - stable_duration_ms >= hover_required_ms
        to: SEARCH
        entry_actions:
          - enable_target_search
        periodic_actions:
          - hold_cruise_height
          - publish_TASK_STATE
        exit_actions:
          - retain_latest_target_estimate
        timeout: null
        failure_transition: null
      - from: SEARCH
        event: TARGET_LOCKED
        guards:
          - vision_target_valid
          - vision_lock_is_stable
        to: FOLLOW
        entry_actions:
          - initialize_follow_controller
        periodic_actions:
          - follow_car
          - publish_TASK_STATE
        exit_actions:
          - retain_follow_controller_state
        timeout: null
        failure_transition: null
      - from: SEARCH
        event: C_ENTER
        guards:
          - event_run_id_matches
          - action_not_previously_started
        to: DROP
        entry_actions:
          - open_action_window
          - mark_drop_started_once
        periodic_actions:
          - search_align_and_drop_when_stable
          - publish_TASK_STATE
          - publish_DROP_STATE
        exit_actions:
          - close_action_window
        timeout: until_D_EXIT
        failure_transition: RETURN
      - from: FOLLOW
        event: C_ENTER
        guards:
          - event_run_id_matches
          - action_not_previously_started
        to: DROP
        entry_actions:
          - open_action_window
          - mark_drop_started_once
        periodic_actions:
          - align_and_drop_when_stable
          - publish_TASK_STATE
          - publish_DROP_STATE
        exit_actions:
          - close_action_window
        timeout: until_D_EXIT
        failure_transition: RETURN
      - from: DROP
        event: DROP_COMPLETE_OR_D_EXIT
        guards:
          - drop_completed or D_EXIT_received or action_timeout
        to: RETURN
        entry_actions:
          - prohibit_additional_drop
          - command_return_to_H
        periodic_actions:
          - navigate_to_H
          - publish_TASK_STATE
        exit_actions:
          - initialize_H_landing
        timeout: 30000
        failure_transition: FAULT
      - from: RETURN
        event: H_LANDMARK_LOCKED
        guards:
          - H_landmark_valid
          - aircraft_above_H
        to: LAND_H
        entry_actions:
          - command_H_landing_once
        periodic_actions:
          - align_and_descend_to_H
          - publish_TASK_STATE
        exit_actions:
          - command_disarm_when_safe
        timeout: 20000
        failure_transition: FAULT
      - from: LAND_H
        event: H_LANDING_CONFIRMED
        guards:
          - landed
          - disarmed
        to: DONE
        entry_actions:
          - store_final_result
        periodic_actions:
          - publish_TASK_STATE
        exit_actions: []
        timeout: 20000
        failure_transition: FAULT

  dynamic_landing_mission:
    initial_state: IDLE
    transitions:
      - from: IDLE
        event: TASK_START
        guards:
          - task_mode == DYNAMIC_LANDING
          - run_id_is_new
          - flight_controller_ready
        to: TAKEOFF
        entry_actions:
          - latch_run_id
          - reset_mission_timer
          - command_takeoff_once
        periodic_actions:
          - publish_TASK_STATE
        exit_actions:
          - mark_takeoff_command_complete
        timeout: 10000
        failure_transition: FAULT
      - from: TAKEOFF
        event: TARGET_HEIGHT_STABLE
        guards:
          - abs(height_cm - target_height_cm) <= target_height_tolerance_cm
          - vertical_speed_is_stable
        to: SEARCH
        entry_actions:
          - enable_target_search
        periodic_actions:
          - hold_cruise_height
          - publish_TASK_STATE
        exit_actions:
          - retain_latest_target_estimate
        timeout: 15000
        failure_transition: FAULT
      - from: SEARCH
        event: TARGET_LOCKED
        guards:
          - vision_target_valid
          - vision_lock_is_stable
        to: FOLLOW
        entry_actions:
          - initialize_follow_controller
        periodic_actions:
          - follow_car
          - publish_TASK_STATE
        exit_actions:
          - retain_follow_controller_state
        timeout: null
        failure_transition: null
      - from: SEARCH
        event: C_ENTER
        guards:
          - event_run_id_matches
          - action_not_previously_started
        to: LAND_CAR
        entry_actions:
          - open_action_window
          - mark_car_landing_started_once
        periodic_actions:
          - search_align_and_descend_when_stable
          - publish_TASK_STATE
          - publish_LAND_STATE
        exit_actions:
          - retain_platform_contact_state
        timeout: until_D_EXIT
        failure_transition: RETURN
      - from: FOLLOW
        event: C_ENTER
        guards:
          - event_run_id_matches
          - action_not_previously_started
        to: LAND_CAR
        entry_actions:
          - open_action_window
          - mark_car_landing_started_once
        periodic_actions:
          - align_and_descend_to_platform
          - publish_TASK_STATE
          - publish_LAND_STATE
        exit_actions:
          - start_platform_stability_check
        timeout: until_D_EXIT
        failure_transition: RETURN
      - from: LAND_CAR
        event: PLATFORM_LANDING_CONFIRMED
        guards:
          - landed_on_platform
          - relative_motion_is_stable
        to: WAIT_5S
        entry_actions:
          - start_platform_wait_timer
        periodic_actions:
          - maintain_safe_platform_state
          - publish_TASK_STATE
          - publish_LAND_STATE
        exit_actions:
          - clear_platform_wait_timer
        timeout: until_D_EXIT
        failure_transition: RETURN
      - from: WAIT_5S
        event: PLATFORM_WAIT_COMPLETE
        guards:
          - stable_duration_ms >= platform_wait_required_ms
        to: RETAKEOFF
        entry_actions:
          - command_platform_takeoff_once
        periodic_actions:
          - publish_TASK_STATE
          - publish_LAND_STATE
        exit_actions:
          - mark_platform_takeoff_command_complete
        timeout: until_D_EXIT
        failure_transition: RETURN
      - from: RETAKEOFF
        event: TARGET_HEIGHT_STABLE
        guards:
          - abs(height_cm - target_height_cm) <= target_height_tolerance_cm
          - aircraft_clear_of_platform
        to: RETURN
        entry_actions:
          - close_action_window
          - command_return_to_H
        periodic_actions:
          - navigate_to_H
          - publish_TASK_STATE
        exit_actions:
          - initialize_H_landing
        timeout: 15000
        failure_transition: FAULT
      - from: RETURN
        event: H_LANDMARK_LOCKED
        guards:
          - H_landmark_valid
          - aircraft_above_H
        to: LAND_H
        entry_actions:
          - command_H_landing_once
        periodic_actions:
          - align_and_descend_to_H
          - publish_TASK_STATE
        exit_actions:
          - command_disarm_when_safe
        timeout: 30000
        failure_transition: FAULT
      - from: LAND_H
        event: H_LANDING_CONFIRMED
        guards:
          - landed
          - disarmed
        to: DONE
        entry_actions:
          - store_final_result
        periodic_actions:
          - publish_TASK_STATE
        exit_actions: []
        timeout: 20000
        failure_transition: FAULT

  car:
    initial_state: READY
    transitions:
      - from: READY
        event: START_BUTTON_PRESSED
        guards:
          - button_debounced
          - car_self_test_passed
        to: READY
        entry_actions:
          - latch_start_countdown
          - keep_motor_disabled
        periodic_actions:
          - keep_motor_disabled
        exit_actions: []
        timeout: start_safety_delay_ms
        failure_transition: READY
      - from: READY
        event: START_SAFETY_DELAY_ELAPSED
        guards:
          - start_countdown_latched
          - elapsed_ms >= start_safety_delay_ms
          - car_self_test_passed
        to: STARTING
        entry_actions:
          - increment_run_id
          - latch_compile_time_task_mode
          - reset_odometry_and_lap
        periodic_actions:
          - keep_motor_disabled
        exit_actions:
          - publish_TASK_START
        timeout: 1000
        failure_transition: FAULT
      - from: STARTING
        event: LINE_ACQUIRED
        guards:
          - fresh_valid_line_available
          - motor_controller_ready
        to: NORMAL_TRACK
        entry_actions:
          - ramp_to_normal_speed
        periodic_actions:
          - drive_straight_at_starting_search_speed
          - search_for_normal_track_line
          - publish_CAR_STATE
          - publish_CAR_POSE
        exit_actions:
          - retain_line_controller_state
        timeout: starting_search_timeout_ms
        failure_transition: FAULT
      - from: NORMAL_TRACK
        event: C_ENTER
        guards:
          - point_c_path_mm <= path_mm < point_d_path_mm
        to: ACTION_SLOW
        entry_actions:
          - ramp_to_action_speed
          - latch_pre_loss_state_as_ACTION_SLOW
        periodic_actions:
          - follow_line
          - publish_C_ENTER
          - publish_CAR_STATE
          - publish_CAR_POSE
        exit_actions:
          - retain_line_controller_state
        timeout: action_slow_max_ms
        failure_transition: NORMAL_TRACK
      - from: ACTION_SLOW
        event: RETURN_OR_D_EXIT
        guards:
          - aircraft_global_state == RETURN or path_mm >= point_d_path_mm or action_slow_timeout
        to: NORMAL_TRACK
        entry_actions:
          - ramp_to_normal_speed
        periodic_actions:
          - follow_line
          - publish_CAR_STATE
          - publish_CAR_POSE
        exit_actions:
          - clear_action_zone_latch
        timeout: null
        failure_transition: null
      - from: NORMAL_TRACK
        event: LINE_LOST
        guards:
          - line_invalid
        to: LOST_HOLD
        entry_actions:
          - save_pre_loss_state
          - hold_last_steering
        periodic_actions:
          - use_reduced_speed
          - publish_CAR_STATE
        exit_actions:
          - retain_last_valid_line
        timeout: line_lost_hold_ms
        failure_transition: REACQUIRE
      - from: ACTION_SLOW
        event: LINE_LOST
        guards:
          - line_invalid
        to: LOST_HOLD
        entry_actions:
          - save_pre_loss_state
          - hold_last_steering
        periodic_actions:
          - do_not_exceed_action_speed
          - publish_CAR_STATE
        exit_actions:
          - retain_last_valid_line
        timeout: line_lost_hold_ms
        failure_transition: REACQUIRE
      - from: LOST_HOLD
        event: LINE_RECOVERED
        guards:
          - line_valid
          - confidence_above_threshold
        to: PREVIOUS_TRACK_STATE
        entry_actions:
          - restore_pre_loss_speed_limit
        periodic_actions:
          - follow_line
          - publish_CAR_STATE
        exit_actions:
          - clear_line_loss_timer
        timeout: line_lost_hold_ms
        failure_transition: REACQUIRE
      - from: REACQUIRE
        event: LINE_RECOVERED
        guards:
          - line_valid
          - confidence_above_threshold
        to: PREVIOUS_TRACK_STATE
        entry_actions:
          - ramp_to_pre_loss_speed
        periodic_actions:
          - follow_line
          - publish_CAR_STATE
        exit_actions:
          - clear_reacquire_timer
        timeout: line_reacquire_max_ms
        failure_transition: FAULT
      - from: NORMAL_TRACK
        event: A_FINISH
        guards:
          - path_mm >= lap_path_mm
        to: FINISH_CONFIRM
        entry_actions:
          - disable_line_follow
          - emergency_stop_motor_driver
          - start_finish_confirmation
        periodic_actions:
          - publish_CAR_STATE
          - publish_CAR_POSE
        exit_actions:
          - latch_lap_complete
        timeout: 300
        failure_transition: DONE
      - from: FINISH_CONFIRM
        event: FINISH_CONFIRMED
        guards:
          - finish_confirmation_elapsed_ms >= 300
        to: DONE
        entry_actions:
          - keep_motor_driver_disabled
        periodic_actions:
          - publish_CAR_STATE
          - publish_CAR_POSE
        exit_actions: []
        timeout: 300
        failure_transition: FAULT

communications:
  topology:
    type: three_point_to_point_links
    radio_module: ECB02
    modules_per_device: 2
    total_modules: 6
    links:
      - {endpoints: [aircraft_controller, car_controller], mode: point_to_point}
      - {endpoints: [aircraft_controller, ground_station], mode: point_to_point}
      - {endpoints: [car_controller, ground_station], mode: point_to_point}
    car_uart_mapping:
      USART2: aircraft_controller
      USART1: ground_station
      USART3: car_k230
  messages:
    TASK_START:
      id: 0x10
      source: car_controller
      destinations:
        - aircraft_controller
        - ground_station
      fields:
        - {name: run_id, type: u8}
        - {name: task_mode, type: u8}
        - {name: normal_speed_mm_s, type: u16_le}
        - {name: action_speed_mm_s, type: u16_le}
    TASK_ABORT:
      id: 0x11
      source: ground_station
      destinations:
        - aircraft_controller
        - car_controller
      fields:
        - {name: run_id, type: u8}
        - {name: reason, type: u8}
    TASK_STATE:
      id: 0x12
      source: aircraft_controller
      destinations:
        - car_controller
        - ground_station
      periodic: true
      fields:
        - {name: run_id, type: u8}
        - {name: task_mode, type: u8}
        - {name: global_state, type: u8}
        - {name: result, type: u8}
        - {name: fault_code, type: u16_le}
        - {name: elapsed_ms, type: u32_le}
        - {name: car_path_mm, type: u32_le}
    CAR_STATE:
      id: 0x31
      source: car_controller
      destinations:
        - aircraft_controller
        - ground_station
      fields:
        - {name: run_id, type: u8}
        - {name: car_state, type: u8}
        - {name: speed_mode, type: u8}
        - {name: line_valid, type: u8}
        - {name: speed_mm_s, type: u16_le}
        - {name: fault_code, type: u16_le}
        - {name: path_mm, type: u32_le}
        - {name: lap, type: u8}
    CAR_POSE:
      id: 0x32
      source: car_controller
      destinations:
        - aircraft_controller
        - ground_station
      fields:
        - {name: run_id, type: u8}
        - {name: x_mm, type: i16_le}
        - {name: y_mm, type: i16_le}
        - {name: heading_deg, type: i16_le}
        - {name: path_mm, type: u32_le}
    TRACK_EVENT:
      id: 0x33
      source: car_controller
      destinations:
        - aircraft_controller
        - ground_station
      fields:
        - {name: run_id, type: u8}
        - {name: event, type: u8}
        - {name: path_mm, type: u32_le}
    CAR_DIAGNOSTIC:
      id: 0x34
      source: car_controller
      destinations:
        - ground_station
      periodic: true
      period_ms: 100
      data_length: 52
      fields:
        - {name: run_id, type: u8}
        - {name: car_state, type: u8}
        - {name: line_state, type: u8}
        - {name: flags, type: u8, bits: [key_raw, key_debounced, k230_received, k230_fresh_valid, marker_fresh, motor_standby, direction_forward, motor_start_delay]}
        - {name: fault_code, type: u16_le}
        - {name: left_requested_pps, type: i32_le}
        - {name: right_requested_pps, type: i32_le}
        - {name: left_target_pps, type: i32_le}
        - {name: right_target_pps, type: i32_le}
        - {name: left_speed_pps, type: i32_le}
        - {name: right_speed_pps, type: i32_le}
        - {name: left_pwm_permille, type: i16_le}
        - {name: right_pwm_permille, type: i16_le}
        - {name: left_total_counts, type: i32_le}
        - {name: right_total_counts, type: i32_le}
        - {name: k230_age_ms, type: u16_le}
        - {name: k230_frame_count_low16, type: u16_le}
        - {name: k230_malformed_count_low16, type: u16_le}
        - {name: path_mm, type: u32_le}
    DROP_STATE:
      id: 0x50
      source: aircraft_controller
      destinations:
        - ground_station
    LAND_STATE:
      id: 0x51
      source: aircraft_controller
      destinations:
        - ground_station
    FAULT:
      id: 0x60
      source: any
      destinations:
        - aircraft_controller
        - ground_station
  routing:
    - source: car_controller
      direct_outputs: [aircraft_controller, ground_station]
    - source: aircraft_controller
      direct_outputs: [car_controller, ground_station]
    - source: ground_station
      allowed_messages: [TASK_ABORT, QUERY]
      direct_outputs: [aircraft_controller, car_controller]

timeouts:
  line_lost_hold_ms: 120
  line_reacquire_max_ms: 3000
  action_slow_max_ms: 25000
  aircraft_state_timeout_ms: 500
  car_state_timeout_ms: 500
  ground_station_offline_ms: 2000
  task_state_period_ms: 100
  car_state_period_ms: 100
  car_pose_period_ms: 100
  car_diagnostic_period_ms: 100
  C_ENTER_period_ms: 100

fault_policies:
  CAR_VISION_SHORT_LOSS:
    severity: warning
    action: enter_LOST_HOLD
  CAR_VISION_LONG_LOSS:
    severity: error
    action: enter_REACQUIRE_then_FAULT_on_timeout
  AIRCRAFT_VISION_LOSS:
    severity: warning
    action: hold_height_and_continue_search_until_D
  FLIGHT_CONTROLLER_TIMEOUT:
    severity: error
    action: stop_new_motion_commands_and_use_flight_controller_failsafe
  GROUND_STATION_OFFLINE:
    severity: info
    action: continue_mission_and_mark_ground_station_offline
  AIRCRAFT_CAR_LINK_LOSS_IN_ACTION_ZONE:
    severity: warning
    action: car_restores_normal_speed_at_D_or_action_timeout
  ACTION_DEADLINE_MISSED:
    severity: error
    action: prohibit_action_and_transition_aircraft_to_RETURN
  TASK_ABORT_RECEIVED:
    severity: critical
    action: aircraft_safe_land_and_car_immediate_stop

invariants:
  - aircraft_controller_is_only_global_state_owner
  - every_device_uses_two_bluetooth_modules
  - no_device_is_required_to_route_for_normal_operation
  - ground_station_offline_does_not_interrupt_normal_mission
  - car_enters_ACTION_SLOW_at_C_without_wireless_confirmation
  - car_restores_normal_speed_after_DROP_or_RETAKEOFF_completion
  - car_restores_normal_speed_at_D_or_action_timeout
  - car_never_intentionally_stops_in_C_D_action_zone
  - side_effect_messages_are_idempotent_by_run_id
  - duplicate_C_ENTER_does_not_repeat_drop_or_landing
  - odometry_path_mm_is_the_primary_source_for_B_C_D_A_track_events
  - path_mm_is_reset_to_zero_when_the_delayed_mission_run_begins
  - C_D_action_slow_is_active_for_point_c_path_mm_to_point_d_path_mm
  - A_FINISH_occurs_when_path_mm_reaches_lap_path_mm
  - K230_marker_detected_is_diagnostic_only_and_cannot_advance_mission_events
  - mission_start_does_not_require_A_marker_or_cross_line_visible
  - motors_remain_disabled_for_start_safety_delay_ms_after_button_latch
  - starting_blind_travel_is_limited_to_starting_search_timeout_ms
  - TASK_STATE_is_periodic
  - C_ENTER_is_periodic_while_in_action_zone
  - drop_descent_takeoff_and_disarm_are_single_trigger_actions
  - no_ACTION_WAIT_C_global_state_exists
  - FOLLOW_waits_for_C_ENTER

acceptance_tests:
  - id: START_SAFETY_DELAY
    expected: motors_remain_disabled_for_10000_ms_after_button_latch
  - id: MAP_PATH_FINISH
    expected: path_mm_reaching_7712_causes_immediate_A_FINISH
  - id: MARKER_CANNOT_ADVANCE_MISSION
    expected: any_marker_detected_sequence_without_required_path_mm_cannot_change_B_C_D_A_events
  - id: MARKER_TEMPORAL_CONFIRMATION
    expected: one_frame_wide_sampling_strip_cannot_assert_marker_detected
  - id: MARKER_VALID_INDEPENDENCE
    expected: marker_detected_remains_available_for_diagnostics_when_line_valid_is_zero
  - id: MARKER_CANDIDATE_INDEPENDENCE
    expected: a_wide_dot_candidate_is_detected_even_when_a_narrow_line_blob_wins_the_steering_score
  - id: STRAIGHT_LINE_STABILITY
    expected: small_lateral_heading_and_curvature_noise_stays_inside_deadband_and_correction_step_limit
  - id: MARKER_DROPOUT_HYSTERESIS
    expected: fewer_than_8_clear_K230_frames_cannot_split_one_physical_dot
  - id: BINARY_PREPROCESS_FALLBACK
    expected: unsupported_binary_or_morphology_API_falls_back_without_crashing_vision
  - id: MAP_SECTION_BOUNDARIES
    expected: B_CROSS_at_1500_C_ENTER_at_3856_D_EXIT_at_5356_A_FINISH_at_7712
  - id: REACH_B_WITHIN_15_SECONDS
    expected: B_CROSS_elapsed_ms <= point_b_deadline_ms
  - id: AUTO_SLOW_AT_C
    expected: path_mm_reaching_3856_changes_car_state_from_NORMAL_TRACK_to_ACTION_SLOW
  - id: FOLLOW_TO_DROP
    expected: DROP_mode_C_ENTER_changes_SEARCH_or_FOLLOW_to_DROP
  - id: FOLLOW_TO_LAND_CAR
    expected: DYNAMIC_LANDING_mode_C_ENTER_changes_SEARCH_or_FOLLOW_to_LAND_CAR
  - id: DROP_RESUME_SPEED
    expected: DROP_to_RETURN_causes_car_to_restore_normal_speed
  - id: DYNAMIC_LANDING_SLOW_WINDOW
    expected: car_remains_ACTION_SLOW_through_LAND_CAR_WAIT_5S_RETAKEOFF
  - id: D_EXIT_FAILURE
    expected: incomplete_action_is_cancelled_and_car_restores_normal_speed
  - id: DUPLICATE_EVENT_IDEMPOTENCY
    expected: duplicate_TASK_START_and_C_ENTER_do_not_repeat_side_effects
  - id: GROUND_STATION_OFFLINE
    expected: aircraft_and_car_continue_without_ground_station
  - id: AIRCRAFT_CAR_LINK_LOSS
    expected: car_does_not_remain_in_ACTION_SLOW_after_D_or_timeout
  - id: ECB02_THREE_POINT_TO_POINT_LINKS
    expected: all_three_direct_links_work_with_two_modules_per_device
  - id: COMPLETE_WITHIN_90_SECONDS
    expected: total_mission_elapsed_ms <= task_deadline_ms
